services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://secureauth:secureauth@db:5432/secureauth
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your environment or .env file}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secureauth
      POSTGRES_PASSWORD: secureauth
      POSTGRES_DB: secureauth
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureauth"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
